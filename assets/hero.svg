<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="70" y1="20" x2="1120" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050817"/><stop offset=".48" stop-color="#0A1230"/><stop offset="1" stop-color="#12072A"/>
    </linearGradient>
    <linearGradient id="accent" x1="265" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36C5FF"><animate attributeName="stop-color" values="#36C5FF;#8B5CF6;#36C5FF" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset=".52" stop-color="#7C5CFF"><animate attributeName="stop-color" values="#7C5CFF;#22D3EE;#7C5CFF" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#D946EF"><animate attributeName="stop-color" values="#D946EF;#5B8CFF;#D946EF" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#5B8CFF" stop-opacity=".42"/><stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="textGlow"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#5B8CFF" flood-opacity=".35"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#7996FF" stroke-opacity=".075"/></pattern>
    <clipPath id="clip"><rect width="1200" height="430" rx="32"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="430" rx="32" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#grid)"/>
    <circle cx="170" cy="110" r="220" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cx" values="170;330;170" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="340" r="250" fill="#8B5CF6" fill-opacity=".16" filter="url(#blur)"><animate attributeName="cy" values="340;230;340" dur="14s" repeatCount="indefinite"/></circle>
    <path d="M0 343C187 293 282 403 466 343C669 278 730 373 920 315C1038 278 1113 286 1200 252" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" values="0;-192" dur="8s" repeatCount="indefinite"/>
    </path>
    <g opacity=".9">
      <circle cx="940" cy="105" r="86" stroke="#5B8CFF" stroke-opacity=".25"/><circle cx="940" cy="105" r="55" stroke="#8B5CF6" stroke-opacity=".3" stroke-dasharray="7 10"><animateTransform attributeName="transform" type="rotate" from="0 940 105" to="360 940 105" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="19" r="6" fill="#38BDF8" filter="url(#soft)"><animateTransform attributeName="transform" type="rotate" from="0 940 105" to="360 940 105" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="105" r="18" fill="#10183B" stroke="#A78BFA"/><path d="M932 105l6 6 12-14" stroke="#69E6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#7DD3FC" opacity=".8">
      <text x="930" y="228">while (learning) {</text><text x="958" y="254">build();</text><text x="958" y="280">solve();</text><text x="930" y="306">}</text>
      <rect x="923" y="210" width="188" height="118" rx="14" stroke="#5B8CFF" stroke-opacity=".16"/>
    </g>
    <g>
