        <rect x="204" y="318" width="111" height="38" rx="19" fill="#171A46" stroke="#8B5CF6" stroke-opacity=".55"/><text x="232" y="342" fill="#C4B5FD">C++20</text>
        <rect x="328" y="318" width="137" height="38" rx="19" fill="#161638" stroke="#A855F7" stroke-opacity=".5"/><text x="354" y="342" fill="#D8B4FE">ELECTRON</text>
        <rect x="478" y="318" width="141" height="38" rx="19" fill="#10283A" stroke="#22D3EE" stroke-opacity=".45"/><text x="504" y="342" fill="#67E8F9">FIREBASE</text>
      </g>
