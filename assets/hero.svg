      <circle cx="94" cy="75" r="5" fill="#34D399"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="109" y="80" fill="#91D9FF" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">BUILDING WITH INTENT</text>
      <text x="72" y="168" fill="#F8FAFF" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800">ABHINAV SHARMA</text>
      <text x="73" y="225" fill="url(#accent)" filter="url(#textGlow)" font-family="Inter,Arial,sans-serif" font-size="35" font-weight="750">Software Engineer · DSA Builder</text>
      <text x="74" y="274" fill="#AAB8D6" font-family="Inter,Arial,sans-serif" font-size="20">Turning interview preparation into systems that learn, recall and improve.</text>
